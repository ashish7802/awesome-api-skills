<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="260" fill="#0d0d0d"/>

  <!-- thin top and bottom rule lines, like a terminal / manpage -->
