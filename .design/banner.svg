  <text x="135" y="225" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#6a6a6a">·</text>
  <text x="150" y="225" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#4ade80">postgresql</text>
  <text x="245" y="225" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#6a6a6a">·</text>
