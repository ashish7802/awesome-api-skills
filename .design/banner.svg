  <text x="350" y="225" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#4ade80">kubernetes</text>
  <text x="450" y="225" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" fill="#6a6a6a">·</text>
