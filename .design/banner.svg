<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="420" fill="#09090b" rx="12"/>
  <rect width="1200" height="420" fill="none" stroke="#27272a" stroke-width="2" rx="12"/>

  <!-- Top Decorative Glow Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#title-gradient)" rx="2"/>

  <!-- Header Title -->
  <text x="50" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#title-gradient)" letter-spacing="-0.5">AWESOME API SKILLS</text>
  <text x="50" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a1a1aa">100 Structured SKILL.md Context Files for AI Coding Agents (Claude Code, Cursor, Codex, Gemini CLI)</text>

  <!-- Badge / Pill Row -->
  <rect x="50" y="108" width="115" height="24" rx="12" fill="#1e293b"/>
  <text x="62" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">100% VERIFIED</text>

  <rect x="175" y="108" width="135" height="24" rx="12" fill="#2e1065"/>
  <text x="187" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc">ZERO HALLUCINATION</text>

  <rect x="320" y="108" width="145" height="24" rx="12" fill="#064e3b"/>
  <text x="332" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">SCHEMA VALIDATED</text>

  <!-- Side by Side Visual Comparison Boxes -->

  <!-- LEFT BOX: Without Skill -->
  <g transform="translate(50, 150)">
    <rect width="530" height="235" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <rect width="530" height="34" rx="8" fill="#27272a"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="72" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#ef4444">❌ WITHOUT SKILL (Agent Guesses Outdated APIs)</text>

    <!-- Code Content -->
    <text x="20" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#f87171">// Hallucinates old SDK signature & body parsing</text>
    <text x="20" y="86" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f4f4f5">app.use(express.json());</text>
    <text x="20" y="110" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f4f4f5">import { authMiddleware } from '@clerk/nextjs';</text>
    <text x="20" y="134" font-family="'JetBrains Mono', monospace" font-size="13" fill="#f4f4f5">for (const u of users) await resend.emails.send();</text>

    <rect x="15" y="152" width="500" height="65" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
    <text x="30" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5" font-weight="700">💥 Webhook signature verification fails (raw body missing)</text>
    <text x="30" y="192" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5">💥 Deprecated Clerk v4 authMiddleware throws runtime error</text>
    <text x="30" y="206" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fca5a5">💥 Unbatched requests hit HTTP 429 Rate Limit (10 req/s)</text>
  </g>

  <!-- RIGHT BOX: With Skill -->
  <g transform="translate(620, 150)">
    <rect width="530" height="235" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <rect width="530" height="34" rx="8" fill="#064e3b"/>
    <circle cx="20" cy="17" r="5" fill="#ef4444"/>
    <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="17" r="5" fill="#10b981"/>
    <text x="72" y="22" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#34d399">⚡ WITH SKILL.md (Exact Current API Patterns)</text>

    <!-- Code Content -->
    <text x="20" y="62" font-family="'JetBrains Mono', monospace" font-size="12" fill="#34d399">// Enforces precise, modern, verified SDK patterns</text>
    <text x="20" y="86" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">app.post('/webhook', express.raw({ type: '*/*' }));</text>
    <text x="20" y="110" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">import { clerkMiddleware } from '@clerk/nextjs/server';</text>
    <text x="20" y="134" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">await resend.batch.send(payloads);</text>

    <rect x="15" y="152" width="500" height="65" rx="6" fill="#022c22" stroke="#047857" stroke-width="1"/>
    <text x="30" y="174" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6ee7b7" font-weight="700">✓ Webhook signature cryptographic validation passes</text>
    <text x="30" y="192" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6ee7b7">✓ Modern Clerk v5 App Router matcher works instantly</text>
    <text x="30" y="206" font-family="'JetBrains Mono', monospace" font-size="11" fill="#6ee7b7">✓ Batch sending executes in 1 HTTP request without 429s</text>
  </g>
</svg>
