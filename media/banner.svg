<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="title-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="460" fill="#09090b" rx="14"/>
  <rect width="1200" height="460" fill="none" stroke="#27272a" stroke-width="2" rx="14"/>

  <!-- Top Accent Glow Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#title-gradient)" rx="2"/>

  <!-- Header Title -->
  <text x="50" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#title-gradient)" letter-spacing="-0.5">AWESOME API SKILLS</text>
  <text x="50" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#a1a1aa">100 Production-Grade SKILL.md Context Files for AI Coding Agents</text>

  <!-- Agent Pill Chips -->
  <g transform="translate(50, 106)">
    <rect x="0" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🤖 Claude Code</text>

    <rect x="125" y="0" width="85" height="26" rx="13" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <text x="137" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#818cf8">⚡ Cursor</text>

    <rect x="220" y="0" width="100" height="26" rx="13" fill="#2e1065" stroke="#4c1d95" stroke-width="1"/>
    <text x="232" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#c084fc">💻 Codex CLI</text>

    <rect x="330" y="0" width="115" height="26" rx="13" fill="#064e3b" stroke="#047857" stroke-width="1"/>
    <text x="342" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#34d399">✨ Gemini CLI</text>
  </g>

  <!-- Side by Side Visual Comparison Boxes -->

  <!-- LEFT BOX: Without Skill -->
  <g transform="translate(50, 152)">
    <rect width="530" height="270" rx="10" fill="#18181b" stroke="#ef4444" stroke-opacity="0.6" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <rect width="530" height="36" rx="10" fill="#27272a"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="72" y="23" font-family="monospace" font-size="12" font-weight="700" fill="#ef4444">WITHOUT SKILL (Agent Guesses Outdated APIs)</text>

    <!-- Code Content -->
    <text x="20" y="62" font-family="monospace" font-size="12" fill="#f87171">// Hallucinates old SDK signatures &amp; body parsing</text>
    <text x="20" y="86" font-family="monospace" font-size="13" fill="#f4f4f5">app.use(express.json());</text>
    <text x="20" y="110" font-family="monospace" font-size="13" fill="#f4f4f5">import { authMiddleware } from '@clerk/nextjs';</text>
    <text x="20" y="134" font-family="monospace" font-size="13" fill="#f4f4f5">for (const u of users) await resend.emails.send();</text>

    <rect x="15" y="155" width="500" height="98" rx="6" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
    <text x="30" y="178" font-family="monospace" font-size="11" fill="#fca5a5" font-weight="700">Stripe Signature Check Fails (Raw buffer corrupted)</text>
    <text x="30" y="200" font-family="monospace" font-size="11" fill="#fca5a5">Deprecated Clerk v4 authMiddleware throws runtime error</text>
    <text x="30" y="222" font-family="monospace" font-size="11" fill="#fca5a5">Unbatched loops trigger HTTP 429 Rate Limit (10 req/s)</text>
    <text x="30" y="240" font-family="monospace" font-size="10" fill="#f87171" font-style="italic">Result: Broken webhooks, authentication crashes, API blocks.</text>
  </g>

  <!-- RIGHT BOX: With Skill -->
  <g transform="translate(620, 152)">
    <rect width="530" height="270" rx="10" fill="#18181b" stroke="#10b981" stroke-opacity="0.8" stroke-width="1.5"/>
    <!-- Terminal Header -->
    <rect width="530" height="36" rx="10" fill="#064e3b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="72" y="23" font-family="monospace" font-size="12" font-weight="700" fill="#34d399">WITH SKILL.md (Exact Current API Patterns)</text>

    <!-- Code Content -->
    <text x="20" y="62" font-family="monospace" font-size="12" fill="#34d399">// Enforces precise, modern, verified SDK patterns</text>
    <text x="20" y="86" font-family="monospace" font-size="13" fill="#34d399">app.post('/webhook', express.raw({ type: '*/*' }));</text>
    <text x="20" y="110" font-family="monospace" font-size="13" fill="#34d399">import { clerkMiddleware } from '@clerk/nextjs/server';</text>
    <text x="20" y="134" font-family="monospace" font-size="13" fill="#34d399">await resend.batch.send(payloads);</text>

    <rect x="15" y="155" width="500" height="98" rx="6" fill="#022c22" stroke="#047857" stroke-width="1"/>
    <text x="30" y="178" font-family="monospace" font-size="11" fill="#6ee7b7" font-weight="700">Cryptographic signature verification passes</text>
    <text x="30" y="200" font-family="monospace" font-size="11" fill="#6ee7b7">Modern Clerk v5 App Router matcher works instantly</text>
    <text x="30" y="222" font-family="monospace" font-size="11" fill="#6ee7b7">500 emails dispatched in 1 HTTP request without 429s</text>
    <text x="30" y="240" font-family="monospace" font-size="10" fill="#34d399" font-style="italic">Result: Production-ready code on the first prompt pass.</text>
  </g>
</svg>
